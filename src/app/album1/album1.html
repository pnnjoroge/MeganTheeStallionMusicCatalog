
<div class="albums">
    <h2>Album: {{ defaultAlbum1.title }}</h2>
    <div *ngIf="!hideDetails">
        <div class="example-card">
            <ul>
                <li> Title: {{ defaultAlbum1.title }}</li> <br>
                <li> Artist: {{ defaultAlbum1.artist }}</li><br>
                <li> Release Date: {{ defaultAlbum1.date }}</li> <br>
                <li> Songs on the Album: 
                    <ul>
                        <li *ngFor="let song of defaultAlbum1.songs">
                            ''{{ song.title }}'', Song length: {{ song.duration }} seconds
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
    <img [src]="defaultAlbum1.imageUrl" (click)="emitAlbum()" alt="Album image" width="400">
        <br>
</div>
