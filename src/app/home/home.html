<div *ngIf="isErrorPage" class="static-container">
    <div class="static-card" style="text-align: center;">
        <h2>404 - Page Not Found</h2>
        <p>The page you are looking for does not exist or has been moved.</p>
        <div style="display: flex; justify-content: center;">
            <a routerLink="/home" (click)="isErrorPage = false" class="details-button">Return to Home</a>
        </div>
    </div>
</div>

<div *ngIf="!isErrorPage">
    <div class="background-img">
        <img src="images/MeganBG.jpeg" alt="background image">
    </div>
    <div class="button">
        <a routerLink="/catalog">See Music Catalog</a>
    </div>
</div>

<router-outlet />
